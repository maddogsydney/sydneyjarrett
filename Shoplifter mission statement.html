<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Video</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 40px;
        }

        .video-container {
            width: 80%;
            max-width: 1000px;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .video-text {
            margin-top: 5cm;      /* Gap below the video */
            text-align: right;    /* Align text to the right */
            font-family: Arial, sans-serif;
            font-size: 14pt;
            color: blue;
        }
    </style>
</head>

<body>

    <div class="video-container">

        <video controls autoplay muted>
            <source src="videos/Shoplifter mission statement.mp4" type="video/mp4">
        </video>

        <p class="video-text">
            Shoplifter mission statement, 2021. Found audio. Filmed by Clover Ryan.
        </p>

    </div>

</body>
</html>
